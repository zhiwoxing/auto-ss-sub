name: Update SS Subscription

# 👇👇👇 这一段非常重要，没有它无法自动保存 👇👇👇
permissions:
  contents: write
# 👆👆👆 必须加上这一段 👆👆👆

on:
  schedule:
    - cron: "0 */3 * * *" # 每3小时运行一次
  workflow_dispatch: # 允许手动运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Download and Process
        run: |
          # 1. 下载原始的 snippet 文件
          curl -s https://raw.githubusercontent.com/WeiGiegie/vpm/main/lq.snippet > raw.txt

          # 2. 删除第一个节点
          sed -i '1d' raw.txt

          # 3. 进行 Base64 编码生成原版 sub.txt (保持最初逻辑不变)
          base64 raw.txt | tr -d '\n' > sub.txt

      - name: Run Converter for Surge and Clash
        run: python .github/convert.py

      - name: Clean up temporary files
        run: rm raw.txt

      - name: Commit and push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # 这里把生成的三个文件一起提交！
          git add sub.txt surge_sub.txt clash_sub.yaml
          # 如果没有变化就不提交，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update subscription" && git push)
